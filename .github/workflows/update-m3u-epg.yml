name: Update IPTV Playlist & EPG

on:
  schedule:
    # Dijalankan setiap 12 jam sekali
    - cron: '0 */12 * * *'
  workflow_dispatch: # Memungkinkan tombol Run manual di tab Actions GitHub

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tambahkan library tambahan jika diperlukan oleh skrip EPG Anda (misal: requests, lxml, dll)
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Run Grabber (Grab & Filter Indonesian Channels + Blacklist)
        run: python grab_indo_m3u.py

      - name: 2. Run Link Checker (2-Level Validation & Revival Check)
        run: python check_m3u.py

      - name: 3. Run Global Blacklist Filter (Clean ich-iptv & hapus.m3u)
        run: python apply_blacklist.py

      - name: 4. Run Program List Generator (Create List_program.txt)
        run: python generate_program_list.py

      - name: 5. Run EPG Generator
        run: python generate_epg.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Grab, Check (2-Level), Blacklist, Program List, & EPG"
          file_pattern: ich-iptv.m3u hapus.m3u epg-ich.xml.gz List_program.txt blacklist_program.txt keyword.txt
