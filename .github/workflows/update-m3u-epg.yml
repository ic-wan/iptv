name: Update IPTV Playlist & EPG

on:
  schedule:
    # Dijalankan setiap hari sekali pada jam 02:00 UTC (Jam 09:00 Pagi WIB / UTC+7)
    - cron: '0 2 * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual via tab Actions

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Run Grabber Script
        run: python grab_indo_m3u.py

      - name: 2. Run 2-Level Link Checker
        run: python check_m3u.py

      - name: 3. Run Global Blacklist Filter
        run: python apply_blacklist.py

      - name: 4. Run Program List Generator
        run: python generate_program_list.py

      - name: 5. Run EPG Generator
        run: python generate_epg.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: All IPTV pipelines"
          file_pattern: ich-iptv.m3u hapus.m3u epg-ich.xml.gz List_program.txt blacklist_program.txt keyword.txt
