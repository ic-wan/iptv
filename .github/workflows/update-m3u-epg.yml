name: Update IPTV Playlist & EPG

on:
  schedule:
    # Dijalankan setiap hari sekali pada jam 02:00 UTC (Jam 09:00 Pagi WIB / UTC+7)
    - cron: '0 2 * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual via tab Actions

jobs:
  update-playlist:
  name: Run IPTV Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Grabber Script
        run: python grab_indo_m3u.py

      - name: Run 2-Level Link Checker
        run: python check_m3u.py

      - name: Run Global Blacklist Filter
        run: python apply_blacklist.py

      - name: Run Program List Generator
        run: python generate_program_list.py

      - name: Run EPG Generator
        run: python generate_epg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update IPTV playlist, EPG, and reports [skip ci]"
          git push
