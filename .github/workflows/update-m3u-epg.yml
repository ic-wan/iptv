name: Update IPTV Playlist & EPG

on:
  schedule:
    # Dijalankan setiap hari sekali pada jam 02:00 UTC (Jam 09:00 Pagi WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Run Grabber Script
        run: python grab_indo_m3u.py

      - name: 2. Run 2-Level Link Checker
        run: python check_m3u.py

      - name: 3. Run Global Blacklist Filter
        run: python apply_blacklist.py

      - name: 4. Run Program List Generator
        run: python generate_program_list.py

      - name: 5. Run EPG Generator
        run: python generate_epg.py

      - name: 6. Update README with Program List (Active Only)
        run: |
          python -c '
          with open("List_program.txt", "r", encoding="utf-8") as f:
              prog_content = f.read()

          if "📂 SUMBER FILE: Arsip Link Mati" in prog_content:
              prog_content = prog_content.split("📂 SUMBER FILE: Arsip Link Mati")[0]

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start_marker = "<!-- START_PROGRAM_LIST -->"
          end_marker = "<!-- END_PROGRAM_LIST -->"

          new_section = f"{start_marker}\n```text\n{prog_content.strip()}\n```\n{end_marker}"

          if start_marker in readme and end_marker in readme:
              parts = readme.split(start_marker)
              before = parts[0]
              after = readme.split(end_marker)[1]
              new_readme = before + new_section + after
          else:
              new_readme = readme.strip() + "\n\n## 📺 Live Program List\n" + new_section + "\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: IPTV pipelines, EPG, and README.md"
          file_pattern: ich-iptv.m3u hapus.m3u epg-ich.xml.gz List_program.txt blacklist_program.txt keyword.txt epg_source.txt README.md
