name: Auto Check M3U & Merge EPG

on:
  schedule:
    # Dijalankan otomatis setiap 12 jam sekali
    - cron: '0 */12 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1. Run M3U Checker Script
        run: python check_m3u.py

      - name: 2. Run EPG Merge Script
        run: python merge_epg.py

      - name: 3. Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ich-iptv.m3u hapus.m3u epg.xml.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: filter dead links & update EPG [skip ci]" && git push)
