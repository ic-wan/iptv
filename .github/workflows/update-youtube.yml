name: Update YouTube Streams Only

on:
  schedule:
    # Dijalankan setiap 3 jam sekali
    - cron: '0 */3 * * *'
  workflow_dispatch: # Tombol eksekusi manual khusus YouTube

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies (Latest yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Run YouTube Grabber & Merge
        run: python generate_youtube_m3u.py

      - name: Commit and push YouTube updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Refresh YouTube streams (every 3 hours)"
          file_pattern: ich-iptv.m3u youtube_source.txt
